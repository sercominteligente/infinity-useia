name: Hakham Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check Control Center JavaScript syntax
        run: |
          python - <<'PY'
          from hakham.web_latest import CONTROL_CENTER_HTML
          chunks = []
          offset = 0
          while True:
              start = CONTROL_CENTER_HTML.find("<script", offset)
              if start == -1:
                  break
              start = CONTROL_CENTER_HTML.find(">", start)
              if start == -1:
                  raise RuntimeError("malformed script tag")
              start += 1
              end = CONTROL_CENTER_HTML.find("</script>", start)
              if end == -1:
                  raise RuntimeError("unclosed script tag")
              chunks.append(CONTROL_CENTER_HTML[start:end])
              offset = end + len("</script>")
          if not chunks:
              raise RuntimeError("no script tags found in latest UI")
          with open("/tmp/hakham-control-center.js", "w", encoding="utf-8") as handle:
              handle.write("\n".join(chunks))
          PY
          node --check /tmp/hakham-control-center.js

      - name: Build container
        run: docker build -t hakham-infinity:ci .
