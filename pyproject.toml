[project]
name = "hakham-infinity"
version = "0.1.0"
description = "HAKHAM Infinity personal AI operating system"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "reportlab>=4.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hakham = "hakham.cli:main"
hakham-ignite = "hakham.ignite:main"
hakham-web = "hakham.web_latest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakham"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
